project_name: jsoup

repo_path: data/repositories/jsoup

smell: GC
smell_name: God Component

target_type: package
target_name: org.jsoup.nodes

maven_command:
  - mvn
  - -q
  - -Dmaven.test.skip=true
  - -Djapicmp.skip=true
  - -Drat.skip=true
  - -Dcheckstyle.skip=true
  - -Dspotbugs.skip=true
  - -Dpmd.skip=true
  - -DskipITs
  - clean
  - verify

designite:
  jar_path: /path/to/DesigniteJava.jar
  output_dir: designite_output

codex:
  command:
    - npx
    - "@openai/codex"
  model: gpt-5.3-codex
  max_attempts: 1
  sandbox: workspace-write
