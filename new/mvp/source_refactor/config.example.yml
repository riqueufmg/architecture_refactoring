mvp:
  name: source_refactor
  run_id: auto

input:
  planner_contract: /absolute/path/to/data/runs/20260528_123456_abcd1234/planner/contract.json

models:
  executor: gpt-5-mini
  repair: gpt-5-mini

prompts:
  system: /data/henrique/langchain_prototype/new/mvp/source_refactor/prompts/system.prompt
  execute_plan: /data/henrique/langchain_prototype/new/mvp/source_refactor/prompts/execute_plan.prompt
  repair_file: /data/henrique/langchain_prototype/new/mvp/source_refactor/prompts/repair_file.prompt

executor:
  temperature: 0.0
  timeout: 180
  max_retries: 5
  max_block_attempts: 5

repair:
  temperature: 0.0
  timeout: 180
  max_retries: 2
  max_repair_rounds: 3

compile:
  command:
    - mvn
    - -q
    - -Dmaven.test.skip=true
    - -Djapicmp.skip=true
    - -Drat.skip=true
    - -Dcheckstyle.skip=true
    - -Dspotbugs.skip=true
    - -Dpmd.skip=true
    - -DskipITs
    - compile

mechanical_tools:
  openrewrite_enabled: true

output:
  runs_dir: /absolute/path/to/data/runs